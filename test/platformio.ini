[platformio]
src_dir = ../src

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.15

build_flags =
    -Wall
    -Wextra
    -DCORE_DEBUG_LEVEL=0
