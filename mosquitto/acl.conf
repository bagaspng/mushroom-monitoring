# ==============================================================================
# acl.conf — Mosquitto Access Control List (Least Privilege Principle)
# ==============================================================================

# User: esp32_device (ESP32 IoT Edge Node in Mushroom House)
# Permitted:
#   - Write/Publish telemetry
#   - Write/Publish online/offline status (including LWT)
#   - Read/Subscribe control commands
user esp32_device
topic write rumahjamur/rumah-jamur-01/telemetry
topic write rumahjamur/rumah-jamur-01/status
topic read  rumahjamur/rumah-jamur-01/control

# User: backend_service (FastAPI Backend running on VPS 127.0.0.1)
# Permitted:
#   - Read/Subscribe all telemetry and status topics under rumahjamur/#
#   - Write/Publish control commands to any device
user backend_service
topic read  rumahjamur/#
topic write rumahjamur/+/control
