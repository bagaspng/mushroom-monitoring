# ============================================================
# mosquitto.conf — Mosquitto MQTT broker for Rumah Jamur
# Development / local-only configuration
#
# Usage:
#   mosquitto -c mosquitto/mosquitto.conf
#
# ⚠ This config allows anonymous connections on all interfaces.
#   Suitable for localhost development only.
#   For production, enable authentication and TLS.
# ============================================================

# ----- Network -----
listener 1883
allow_anonymous true

# ----- Logging -----
log_dest stdout
log_type all

# ----- Persistence -----
# Keep messages in memory only (no persistence file)
persistence false

# ----- Connection limits -----
# Increase if you have many simultaneous clients
max_connections -1

# ----- Retained messages -----
# Keep retained messages (important for LWT / status topic)
retain_available true
