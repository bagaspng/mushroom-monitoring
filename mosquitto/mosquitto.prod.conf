# ==============================================================================
# mosquitto.prod.conf — Production Mosquitto Broker Configuration
# Target Domain: sirkulalestari.com / VPS IP: 103.245.38.68
# ==============================================================================

# ----- Network Listeners -----
# 1. Local listener on localhost (unencrypted) for internal FastAPI backend
listener 1883 127.0.0.1
allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/acl.conf

# 2. Public TLS listener on port 8883 for external ESP32 devices
listener 8883
allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/acl.conf

# TLS Certificate Paths (Let's Encrypt certificates for sirkulalestari.com)
certfile /etc/letsencrypt/live/sirkulalestari.com/fullchain.pem
keyfile /etc/letsencrypt/live/sirkulalestari.com/privkey.pem
tls_version tlsv1.2

# ----- Logging -----
log_dest file /var/log/mosquitto/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# ----- Connection Limits & Performance -----
max_connections 100
max_keepalive 60

# ----- Message Retention & Persistence -----
persistence true
persistence_location /var/lib/mosquitto/
retain_available true
